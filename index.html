<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Offroad Fysikksimulator - Avansert</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #000; overflow: hidden; font-family: sans-serif; user-select: none; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #111; z-index: 20; color: #fff; }
        .btn { padding: 15px 30px; margin: 10px; font-size: 18px; background: #28a745; color: white; border: none; cursor: pointer; text-transform: uppercase; font-weight: bold; border-radius: 5px; }
        .btn-blue { background: #0056b3; }
        .btn-red { background: #b30000; padding: 10px 15px; font-size: 14px; margin-top: 10px; }
        
        #game-canvas { display: none; width: 100%; height: 100%; background: #1a1a2e; }
        
        /* Kontrollpanel */
        #physics-panel { position: absolute; top: 10px; left: 10px; z-index: 15; background: rgba(0, 0, 0, 0.8); color: #fff; padding: 15px; border-radius: 8px; border: 1px solid #444; display: none; flex-direction: column; width: 280px; max-height: 90vh; overflow-y: auto; }
        .slider-container { margin-bottom: 12px; }
        .slider-container label { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px; color: #aaa; }
        .slider-container input[type="range"] { width: 100%; }
        
        #toggle-panel { position: absolute; top: 10px; right: 10px; z-index: 15; padding: 10px; background: #333; color: white; border: none; border-radius: 4px; display: none; }
        #hud { position: absolute; bottom: 20px; left: 20px; color: #0f0; font-family: monospace; font-size: 18px; display: none; text-shadow: 1px 1px 0 #000; pointer-events: none; }
    </style>
</head>
<body>

    <button id="toggle-panel" onclick="toggleMenu()">⚙️ Innstillinger / Reset</button>
    <div id="hud">Hastighet: 0 km/t</div>

    <div id="physics-panel">
        <h3 style="margin-top:0; border-bottom: 1px solid #555; padding-bottom: 5px;">Fysikk-parametere</h3>
        
        <div class="slider-container">
            <label><span>Tyngdekraft</span> <span id="val-grav">0.40</span></label>
            <input type="range" id="cfg-grav" min="0.1" max="1.0" step="0.05" value="0.4" oninput="updateConfig()">
        </div>
        <div class="slider-container">
            <label><span>Fjærstivhet (K)</span> <span id="val-stiff">0.12</span></label>
            <input type="range" id="cfg-stiff" min="0.01" max="0.5" step="0.01" value="0.12" oninput="updateConfig()">
        </div>
        <div class="slider-container">
            <label><span>Støtdemping (C)</span> <span id="val-damp">0.08</span></label>
            <input type="range" id="cfg-damp" min="0.01" max="0.3" step="0.01" value="0.08" oninput="updateConfig()">
        </div>
        <div class="slider-container">
            <label><span>Fjærlengde (Rest)</span> <span id="val-len">30</span></label>
            <input type="range" id="cfg-len" min="10" max="60" step="1" value="30" oninput="updateConfig()">
        </div>
        <div class="slider-container">
            <label><span>Motorkraft</span> <span id="val-pwr">0.15</span></label>
            <input type="range" id="cfg-pwr" min="0.05" max="0.5" step="0.01" value="0.15" oninput="updateConfig()">
        </div>
        <div class="slider-container">
            <label><span>Dekkfriksjon / Grep</span> <span id="val-fric">0.95</span></label>
            <input type="range" id="cfg-fric" min="0.8" max="1.0" step="0.01" value="0.95" oninput="updateConfig()">
        </div>
        <div class="slider-container">
            <label><span>Luftmotstand (Drag)</span> <span id="val-drag">0.99</span></label>
            <input type="range" id="cfg-drag" min="0.90" max="1.0" step="0.005" value="0.99" oninput="updateConfig()">
        </div>
        
        <button class="btn btn-red" onclick="resetGame()">Kjør Reset</button>
    </div>

    <div id="ui-layer">
        <h1 style="text-transform: uppercase; letter-spacing: 2px;">Avansert Fysikk</h1>
        <button class="btn" onclick="startGame(true)">Tastatur</button>
        <button class="btn btn-blue" onclick="startGame(false)">Gamepad</button>
    </div>

    <canvas id="game-canvas"></canvas>

    <script>
        let canvas, ctx;
        let gameActive = false;
        let useKeyboard = false;

        // Fysikk-konfigurasjon (oppdateres fra glidere)
        let config = {
            gravity: 0.4,
            stiffness: 0.12,
            damping: 0.08,
            restLength: 30,
            enginePower: 0.15,
            friction: 0.95,
            drag: 0.99
        };

        let keys = { right: false, left: false, up: false, down: false };

        window.addEventListener('keydown', (e) => {
            if(e.code === 'ArrowRight') keys.right = true;
            if(e.code === 'ArrowLeft') keys.left = true;
            if(e.code === 'ArrowUp') keys.up = true;
            if(e.code === 'ArrowDown') keys.down = true;
        });
        window.addEventListener('keyup', (e) => {
            if(e.code === 'ArrowRight') keys.right = false;
            if(e.code === 'ArrowLeft') keys.left = false;
            if(e.code === 'ArrowUp') keys.up = false;
            if(e.code === 'ArrowDown') keys.down = false;
        });

        function updateConfig() {
            config.gravity = parseFloat(document.getElementById('cfg-grav').value);
            config.stiffness = parseFloat(document.getElementById('cfg-stiff').value);
            config.damping = parseFloat(document.getElementById('cfg-damp').value);
            config.restLength = parseFloat(document.getElementById('cfg-len').value);
            config.enginePower = parseFloat(document.getElementById('cfg-pwr').value);
            config.friction = parseFloat(document.getElementById('cfg-fric').value);
            config.drag = parseFloat(document.getElementById('cfg-drag').value);

            document.getElementById('val-grav').innerText = config.gravity.toFixed(2);
            document.getElementById('val-stiff').innerText = config.stiffness.toFixed(2);
            document.getElementById('val-damp').innerText = config.damping.toFixed(2);
            document.getElementById('val-len').innerText = config.restLength;
            document.getElementById('val-pwr').innerText = config.enginePower.toFixed(2);
            document.getElementById('val-fric').innerText = config.friction.toFixed(2);
            document.getElementById('val-drag').innerText = config.drag.toFixed(3);
        }

        function toggleMenu() {
            const panel = document.getElementById('physics-panel');
            panel.style.display = panel.style.display === 'flex' ? 'none' : 'flex';
        }

        function resetGame() {
            buildTerrain();
            car = new Car(100, 200);
            document.getElementById('physics-panel').style.display = 'none';
        }

        let terrainPoints = [];

        class Car {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.vx = 0;
                this.vy = 0;
                this.angle = 0;
                this.angularVelocity = 0;
                
                // Hjul monteres relativt til chassisets senter
                this.wheelOffsets = [
                    { x: -45, y: 15 }, // Bakhjul
                    { x: 45, y: 15 }   // Forhjul
                ];
                
                this.wheels = [
                    { x: x - 45, y: y + 30, vx: 0, vy: 0, radius: 18, angle: 0, angVel: 0, grounded: false },
                    { x: x + 45, y: y + 30, vx: 0, vy: 0, radius: 18, angle: 0, angVel: 0, grounded: false }
                ];
            }

            update(throttle, tilt) {
                // 1. Påfør tyngdekraft på chassis
                this.vy += config.gravity;

                // 2. Chassis tilt i luften (vektoverføring)
                if (Math.abs(tilt) > 0.1) {
                    this.angularVelocity += tilt * 0.003;
                }

                // 3. Oppdater hvert hjul via Hookes lov (Fjæring + Demping)
                for (let i = 0; i < 2; i++) {
                    let w = this.wheels[i];
                    let offset = this.wheelOffsets[i];

                    // Kalkuler festepunktet for hjulet på rotert chassis
                    let cosA = Math.cos(this.angle);
                    let sinA = Math.sin(this.angle);
                    let mountX = this.x + (offset.x * cosA - offset.y * sinA);
                    let mountY = this.y + (offset.x * sinA + offset.y * cosA);

                    // Retning for fjæringsaksen (rett ned i forhold til bilen)
                    let springAxisX = -sinA;
                    let springAxisY = cosA;

                    // Trekk hjulet mot festepunktet (forenklet rigid line constraint for x-aksen)
                    w.x = mountX + springAxisX * config.restLength;
                    
                    // Beregn nåværende fjærlengde (kun y-kompresjon analyseres for forenkling)
                    let currentLength = Math.sqrt(Math.pow(w.x - mountX, 2) + Math.pow(w.y - mountY, 2));
                    
                    // Beregn relativ hastighet ved festepunktet for støtdemping
                    // v = v_center + angular_velocity x radius
                    let mountVy = this.vy + this.angularVelocity * (mountX - this.x);
                    let relVy = w.vy - mountVy;

                    // Hookes lov: F = -k*x - c*v
                    let displacement = currentLength - config.restLength;
                    let springForceY = (displacement * config.stiffness) + (relVy * config.damping);

                    // Påfør kreftene
                    this.vy += springForceY; // Skyver chassis opp
                    
                    // Konverter vertikal kraft til rotasjonsmoment
                    let torque = (mountX - this.x) * springForceY;
                    this.angularVelocity += torque * 0.0002; 

                    w.vy -= springForceY; // Skyver hjulet ned
                    w.vy += config.gravity;

                    // 4. Kollisjon mellom hjul og terreng
                    w.y += w.vy;
                    w.grounded = false;

                    for (let j = 0; j < terrainPoints.length - 1; j++) {
                        let p1 = terrainPoints[j];
                        let p2 = terrainPoints[j+1];

                        if (w.x >= p1.x && w.x <= p2.x) {
                            let t = (w.x - p1.x) / (p2.x - p1.x);
                            let groundY = p1.y + t * (p2.y - p1.y);

                            if (w.y + w.radius > groundY) {
                                w.y = groundY - w.radius;
                                w.vy = 0;
                                w.grounded = true;

                                // Fremdrift og friksjon
                                if (throttle !== 0) {
                                    w.angVel += throttle * config.enginePower;
                                }
                                
                                // Skyv chassiset basert på hjulrotasjon
                                this.vx += w.angVel * 0.1;
                                
                                // Friksjonstap
                                w.angVel *= config.friction;
                                this.vx *= config.friction;
                            }
                            break;
                        }
                    }
                    w.angle += w.angVel;
                }

                // 5. Oppdater posisjon
                this.vx *= config.drag;
                this.vy *= config.drag;
                this.angularVelocity *= 0.95; // Rotasjonsdemping (Drag)

                this.x += this.vx;
                this.y += this.vy;
                this.angle += this.angularVelocity;
            }

            draw() {
                // Tegn Hjul
                this.wheels.forEach(w => {
                    ctx.save();
                    ctx.translate(w.x, w.y);
                    ctx.rotate(w.angle);
                    ctx.beginPath();
                    ctx.arc(0, 0, w.radius, 0, Math.PI * 2);
                    ctx.fillStyle = '#222';
                    ctx.fill();
                    ctx.strokeStyle = '#fff';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.moveTo(0, 0); ctx.lineTo(w.radius, 0); // Eike
                    ctx.stroke();
                    
                    // Knaster (Grep-visuell)
                    for(let i=0; i<6; i++) {
                        ctx.beginPath();
                        ctx.arc(w.radius, 0, 3, 0, Math.PI*2);
                        ctx.fillStyle = '#666';
                        ctx.fill();
                        ctx.rotate(Math.PI / 3);
                    }
                    ctx.restore();
                });

                // Tegn Chassis
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);
                ctx.fillStyle = '#cc0000';
                ctx.fillRect(-55, -20, 110, 35);
                ctx.fillStyle = '#880000';
                ctx.fillRect(-35, -40, 70, 25);
                
                // Visuelle dempere
                ctx.strokeStyle = '#ccc';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(-45, 15); ctx.lineTo(-45, config.restLength + 5);
                ctx.moveTo(45, 15); ctx.lineTo(45, config.restLength + 5);
                ctx.stroke();

                ctx.restore();
            }
        }

        let car;

        function buildTerrain() {
            terrainPoints = [];
            let currentX = -200;
            let currentY = 400;

            for (let i = 0; i < 600; i++) {
                let difficulty = i / 600;
                let stepX = 40;
                
                // Kompleks bølgematematikk for å skape hull, løyper og skarpe kanter
                let wave1 = Math.sin(currentX * 0.005) * 60;
                let wave2 = Math.cos(currentX * 0.015) * 40;
                let bumps = Math.sin(currentX * 0.05) * (20 * difficulty);
                let microBumps = (Math.random() - 0.5) * (15 * difficulty);

                let nextX = currentX + stepX;
                let nextY = 400 + wave1 + wave2 + bumps + microBumps - (difficulty * 400);

                terrainPoints.push({ x: currentX, y: currentY });
                currentX = nextX;
                currentY = nextY;
            }
        }

        function startGame(keyboard) {
            useKeyboard = keyboard;
            document.getElementById('ui-layer').style.display = 'none';
            document.getElementById('toggle-panel').style.display = 'block';
            document.getElementById('hud').style.display = 'block';
            
            canvas = document.getElementById('game-canvas');
            canvas.style.display = 'block';
            ctx = canvas.getContext('2d');
            
            resize();
            window.addEventListener('resize', resize);
            
            updateConfig(); // Synk glidere med logikk
            resetGame();

            gameActive = true;
            requestAnimationFrame(loop);
        }

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        function applyInput() {
            let throttle = 0;
            let tilt = 0;

            if (useKeyboard) {
                if (keys.right) throttle = 1;
                if (keys.left) throttle = -1;
                if (keys.up) tilt = -1;
                if (keys.down) tilt = 1;
            } else {
                const gps = navigator.getGamepads ? navigator.getGamepads() : [];
                const gp = gps[0];
                if (gp && gp.buttons && gp.buttons.length > 7) {
                    throttle = gp.buttons[7].value;
                    if (throttle === 0 && gp.buttons[6].value > 0) throttle = -gp.buttons[6].value;
                    tilt = gp.axes[0];
                }
            }

            car.update(throttle, tilt);

            const speed = Math.round(Math.abs(car.vx) * 3.6);
            document.getElementById('hud').innerText = `Hastighet: ${speed} km/t`;
        }

        function drawTerrain() {
            ctx.beginPath();
            ctx.moveTo(terrainPoints[0].x, terrainPoints[0].y);
            for (let i = 1; i < terrainPoints.length; i++) {
                ctx.lineTo(terrainPoints[i].x, terrainPoints[i].y);
            }
            ctx.lineTo(terrainPoints[terrainPoints.length - 1].x, canvas.height + 2000);
            ctx.lineTo(terrainPoints[0].x, canvas.height + 2000);
            ctx.closePath();

            ctx.fillStyle = '#3a2511';
            ctx.fill();
            ctx.strokeStyle = '#6e9752';
            ctx.lineWidth = 6;
            ctx.stroke();
        }

        function loop() {
            if (!gameActive) return;

            applyInput();

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Kamera følger bilen fast i senter
            ctx.save();
            ctx.translate(canvas.width / 2 - car.x, canvas.height / 2 - car.y + 100);

            drawTerrain();
            car.draw();

            ctx.restore();

            requestAnimationFrame(loop);
        }
    </script>
</body>
</html>
