<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Offroad Fysikksimulator</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #000; overflow: hidden; font-family: sans-serif; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #111; z-index: 10; color: #fff; }
        .header { font-size: 24px; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 2px; }
        .btn { padding: 15px 30px; margin: 10px; font-size: 18px; background: #28a745; color: white; border: none; cursor: pointer; text-transform: uppercase; font-weight: bold; border-radius: 5px; }
        .btn-blue { background: #0056b3; }
        #game-canvas { display: none; width: 100%; height: 100%; background: #1a1a2e; }
        #fullscreen-btn { position: absolute; top: 10px; right: 10px; z-index: 20; padding: 10px 15px; background: rgba(0,0,0,0.6); color: #fff; border: 1px solid #555; cursor: pointer; display: none; border-radius: 4px; }
        #debug-info { position: absolute; top: 10px; left: 10px; z-index: 20; color: #0f0; display: none; pointer-events: none; font-family: monospace; font-size: 16px; text-shadow: 1px 1px 2px #000;}
    </style>
</head>
<body>

    <button id="fullscreen-btn" onclick="toggleFullScreen()">[  ] Fullskjerm</button>
    <div id="debug-info">Hastighet: 0 km/t</div>

    <div id="ui-layer">
        <div class="header">Offroad Fysikksimulator</div>
        <button class="btn" onclick="startGame(true)">Start med Tastatur</button>
        <button class="btn btn-blue" onclick="startGame(false)">Start med Gamepad</button>
        <p style="color:#888; margin-top:20px;">Tastatur: Pil Høyre (Gass), Pil Venstre (Brems/Rev), Pil Opp/Ned (Tilt)</p>
    </div>

    <canvas id="game-canvas"></canvas>

    <script>
        let canvas, ctx;
        let gameActive = false;
        let useKeyboard = false;
        let engineAudio;

        let keys = { right: false, left: false, up: false, down: false };

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else if (document.exitFullscreen) {
                document.exitFullscreen();
            }
        }

        window.addEventListener('keydown', (e) => {
            if(e.code === 'ArrowRight') keys.right = true;
            if(e.code === 'ArrowLeft') keys.left = true;
            if(e.code === 'ArrowUp') keys.up = true;
            if(e.code === 'ArrowDown') keys.down = true;
        });
        window.addEventListener('keyup', (e) => {
            if(e.code === 'ArrowRight') keys.right = false;
            if(e.code === 'ArrowLeft') keys.left = false;
            if(e.code === 'ArrowUp') keys.up = false;
            if(e.code === 'ArrowDown') keys.down = false;
        });

        // --- LYDSYSTEM ---
        class AudioSystem {
            constructor() {
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                this.osc = this.ctx.createOscillator();
                this.osc.type = 'sawtooth';
                this.filter = this.ctx.createBiquadFilter();
                this.filter.type = 'lowpass';
                this.gain = this.ctx.createGain();
                
                this.osc.connect(this.filter);
                this.filter.connect(this.gain);
                this.gain.connect(this.ctx.destination);
                
                this.osc.start();
                this.gain.gain.value = 0.1;
                this.currentRPM = 0;
                this.prevThrottle = 0;
            }

            update(throttle) {
                if(this.ctx.state === 'suspended') this.ctx.resume();
                this.currentRPM += (throttle - this.currentRPM) * 0.1;
                this.osc.frequency.setTargetAtTime(40 + (this.currentRPM * 140), this.ctx.currentTime, 0.05);
                this.filter.frequency.setTargetAtTime(150 + (this.currentRPM * 2200), this.ctx.currentTime, 0.05);
                this.gain.gain.setTargetAtTime(0.08 + (this.currentRPM * 0.25), this.ctx.currentTime, 0.05);

                if (this.prevThrottle > 0.8 && throttle < 0.1) this.triggerBackfire();
                this.prevThrottle = throttle;
            }

            triggerBackfire() {
                const bufferSize = this.ctx.sampleRate * 0.12;
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

                const noise = this.ctx.createBufferSource();
                noise.buffer = buffer;
                const nGain = this.ctx.createGain();
                nGain.gain.setValueAtTime(0.7, this.ctx.currentTime);
                nGain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
                
                const bp = this.ctx.createBiquadFilter();
                bp.type = 'bandpass';
                bp.frequency.value = 350;

                noise.connect(bp);
                bp.connect(nGain);
                nGain.connect(this.ctx.destination);
                noise.start();
            }
        }

        // --- INNEBYGD 2D FYSIKKMOTOR ---
        const gravity = 0.4;
        let terrainPoints = [];

        class Wheel {
            constructor(offsetX, offsetY, radius) {
                this.offsetX = offsetX;
                this.offsetY = offsetY;
                this.radius = radius;
                this.x = 0;
                this.y = 0;
                this.oldX = 0;
                this.oldY = 0;
                this.vx = 0;
                this.vy = 0;
                this.angularVelocity = 0;
                this.angle = 0;
                this.isGrounded = false;
            }

            update(chassisX, chassisY, chassisAngle) {
                // Kalkuler forventet posisjon festet til chassis
                const rad = chassisAngle;
                const targetX = chassisX + (this.offsetX * Math.cos(rad) - this.offsetY * Math.sin(rad));
                const targetY = chassisY + (this.offsetX * Math.sin(rad) + this.offsetY * Math.cos(rad));

                // Fjæring & demping (Spring constraint mot target)
                const k = 0.15; // Fjærstivhet
                const damping = 0.85; // Støtdemper

                this.vx += (targetX - this.x) * k;
                this.vy += (targetY - this.y) * k;
                this.vy += gravity;

                this.vx *= damping;
                this.vy *= damping;

                this.x += this.vx;
                this.y += this.vy;

                // Terreng-kollisjon
                this.isGrounded = false;
                for (let i = 0; i < terrainPoints.length - 1; i++) {
                    let p1 = terrainPoints[i];
                    let p2 = terrainPoints[i+1];

                    if (this.x >= p1.x && this.x <= p2.x) {
                        // Linjær interpolasjon for å finne bakkehøyde ved hjul-X
                        let t = (this.x - p1.x) / (p2.x - p1.x);
                        let groundY = p1.y + t * (p2.y - p1.y);

                        if (this.y + this.radius > groundY) {
                            this.y = groundY - this.radius;
                            this.vy = 0;
                            this.isGrounded = true;

                            // Friksjon & Fremdrift
                            this.x += this.angularVelocity * this.radius;
                            this.angularVelocity *= 0.92; // Dekkfriksjon
                        }
                        break;
                    }
                }

                this.angle += this.angularVelocity;
            }
        }

        class Car {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.vx = 0;
                this.vy = 0;
                this.angle = 0;
                this.angularVelocity = 0;
                this.wheelR = new Wheel(-45, 25, 18);
                this.wheelF = new Wheel(45, 25, 18);
                
                // Initier hjulposisjoner
                this.wheelR.x = x - 45; this.wheelR.y = y + 25;
                this.wheelF.x = x + 45; this.wheelF.y = y + 25;
            }

            update(throttle, tilt) {
                this.vy += gravity;

                // Motor-pådrag til hjulene (4x4)
                const enginePower = 0.08;
                if (throttle !== 0) {
                    if (this.wheelR.isGrounded) this.wheelR.angularVelocity += throttle * enginePower;
                    if (this.wheelF.isGrounded) this.wheelF.angularVelocity += throttle * enginePower;
                }

                // Tilt i luft / vektoverføring
                if (Math.abs(tilt) > 0.1) {
                    this.angularVelocity += tilt * 0.005;
                }

                // Oppdater hjul (Fjæring)
                this.wheelR.update(this.x, this.y, this.angle);
                this.wheelF.update(this.x, this.y, this.angle);

                // Reaksjonskraft fra hjulene tilbake til chassiset
                const avgWheelY = (this.wheelR.y + this.wheelF.y) / 2 - 25;
                const avgWheelX = (this.wheelR.x + this.wheelF.x) / 2;

                this.vx += (avgWheelX - this.x) * 0.05;
                this.vy += (avgWheelY - this.y) * 0.05;

                // Vinkel basert på posisjonen til bakhjul vs forhjul
                let targetAngle = Math.atan2(this.wheelF.y - this.wheelR.y, this.wheelF.x - this.wheelR.x);
                this.angularVelocity += (targetAngle - this.angle) * 0.05;
                this.angularVelocity *= 0.85; // Rotasjonsdemping

                this.vx *= 0.99;
                this.vy *= 0.99;

                this.x += this.vx;
                this.y += this.vy;
                this.angle += this.angularVelocity;
            }

            draw() {
                // Tegn Hjul
                [this.wheelR, this.wheelF].forEach(w => {
                    ctx.save();
                    ctx.translate(w.x, w.y);
                    ctx.rotate(w.angle);
                    ctx.beginPath();
                    ctx.arc(0, 0, w.radius, 0, Math.PI * 2);
                    ctx.fillStyle = '#222';
                    ctx.fill();
                    ctx.strokeStyle = '#fff';
                    ctx.lineWidth = 3;
                    // Tegn felg-linje for å vise rotasjon
                    ctx.beginPath();
                    ctx.moveTo(0, 0); ctx.lineTo(w.radius, 0);
                    ctx.stroke();
                    ctx.restore();
                });

                // Tegn Chassis
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);
                ctx.fillStyle = '#cc0000';
                ctx.fillRect(-55, -20, 110, 35); // Karosseri
                ctx.fillStyle = '#880000';
                ctx.fillRect(-35, -40, 70, 25);  // Tak
                ctx.restore();
            }
        }

        let car;

        function buildTerrain() {
            terrainPoints = [];
            let currentX = -200;
            let currentY = 400;

            for (let i = 0; i < 500; i++) {
                let difficulty = i / 500;
                let stepX = 40;
                let wave = Math.sin(currentX * 0.005) * 80;
                let bumps = Math.sin(currentX * 0.03) * (30 * difficulty);
                let noise = (Math.random() - 0.5) * (40 * difficulty);

                let nextX = currentX + stepX;
                let nextY = 400 + wave + bumps + noise - (difficulty * 300); // Stiger gradvis

                terrainPoints.push({ x: currentX, y: currentY });
                currentX = nextX;
                currentY = nextY;
            }
        }

        function startGame(keyboard) {
            useKeyboard = keyboard;
            document.getElementById('ui-layer').style.display = 'none';
            canvas = document.getElementById('game-canvas');
            canvas.style.display = 'block';
            document.getElementById('fullscreen-btn').style.display = 'block';
            document.getElementById('debug-info').style.display = 'block';
            ctx = canvas.getContext('2d');
            
            engineAudio = new AudioSystem();
            
            resize();
            window.addEventListener('resize', resize);
            
            buildTerrain();
            car = new Car(100, 200);

            gameActive = true;
            requestAnimationFrame(loop);
        }

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        function applyInput() {
            let throttle = 0;
            let tilt = 0;

            if (useKeyboard) {
                if (keys.right) throttle = 1;
                if (keys.left) throttle = -1;
                if (keys.up) tilt = -1;
                if (keys.down) tilt = 1;
            } else {
                const gps = navigator.getGamepads ? navigator.getGamepads() : [];
                const gp = gps[0];
                if (gp && gp.buttons && gp.buttons.length > 7) {
                    throttle = gp.buttons[7].value; // R2
                    if (throttle === 0 && gp.buttons[6].value > 0) throttle = -gp.buttons[6].value; // L2
                    tilt = gp.axes[0]; // Left stick
                }
            }

            car.update(throttle, tilt);
            engineAudio.update(Math.abs(throttle));

            const speed = Math.round(Math.sqrt(car.vx * car.vx + car.vy * car.vy) * 3.6);
            document.getElementById('debug-info').innerText = `Hastighet: ${speed} km/t`;
        }

        function drawTerrain() {
            ctx.beginPath();
            ctx.moveTo(terrainPoints[0].x, terrainPoints[0].y);
            for (let i = 1; i < terrainPoints.length; i++) {
                ctx.lineTo(terrainPoints[i].x, terrainPoints[i].y);
            }
            ctx.lineTo(terrainPoints[terrainPoints.length - 1].x, canvas.height + 2000);
            ctx.lineTo(terrainPoints[0].x, canvas.height + 2000);
            ctx.closePath();

            ctx.fillStyle = '#3a2511';
            ctx.fill();
            ctx.strokeStyle = '#4e8752';
            ctx.lineWidth = 8;
            ctx.stroke();
        }

        function loop() {
            if (!gameActive) return;

            applyInput();

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Kameratransformasjon (Følg bilen)
            ctx.save();
            ctx.translate(canvas.width / 2 - car.x, canvas.height / 2 - car.y);

            drawTerrain();
            car.draw();

            ctx.restore();

            requestAnimationFrame(loop);
        }
    </script>
</body>
</html>
